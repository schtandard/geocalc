[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "setuptools_scm[toml]>=7"
]
build-backend = "setuptools.build_meta"

[project]
name = "geocalc"
description = "Calculating physical parameters for device geometries"
readme = "readme.md"
requires-python = ">=3.8"
authors = [
    {name = "Benedikt Wilde", email = "bwilde@posteo.de"}
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.8",
]
dependencies = [
    "numpy",
    "scipy",
    "mpmath",
]
dynamic = ["version"]

[tool.setuptools_scm]
