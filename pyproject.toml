[build-system]
requires = [
    "setuptools>=42",
    "wheel",
    "setuptools_scm[toml]>=7"
]
build-backend = "setuptools.build_meta"

[project]
name = "geocalc"
description = "Calculating physical parameters from device geometry"
readme = "readme.md"
license = "GPL-3.0-or-later"
license-files = ["license"]
requires-python = ">=3.12"
authors = [
    {name = "Benedikt Wilde", email = "bwilde@posteo.de"}
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy",
    "scipy",
    "mpmath",
]
dynamic = ["version"]

[project.optional-dependencies]
doc = [
    "sphinx",
    "sphinx_rtd_theme",
]

[tool.setuptools_scm]
